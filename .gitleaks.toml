[extend]
# Extend the default gitleaks ruleset
useDefault = true

[allowlist]
description = "Global allowlist to ignore historical scripts with revoked keys and mock secrets/hashes in documentation/testing code."
paths = [
  '''web/src/components/landing/useHomeAuth\.ts''',
  '''generator/.*\.py''',
  '''docs/GCP_CLOUD_RUN_DEPLOYMENT\.md''',
  '''web/scripts/register_parameters\.ts''',
  '''web/db_deploy\.js''',
  '''web/src/lib/db\.ts''',
  '''web/src/lib/db/seeds\.ts''',
  '''web/src/lib/db/seeds_modules/.*''',
  '''web/tests/crypto_migration\.spec\.ts''',
  '''scripts/keep_alive_dispatcher\.js''',
  '''web/scripts/update_supabase_cloud_url\.js''',
  '''web/src/lib/dispatcher\.ts''',
  '''web/scratch/.*'''
]
regexes = [
  '''OPSecretGate_[a-zA-Z0-9]+'''
]
