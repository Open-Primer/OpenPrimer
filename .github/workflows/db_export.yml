name: OpenPrimer DB Core Export

on:
  schedule:
    # Run every night at midnight UTC to keep the public seed up to date with new pedagogical additions
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  export-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm install

      - name: Run Database Exporter Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd web
          npm run db:export

      - name: Create Pull Request with Seed File
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(db): auto-export public database core content to public seed [skip ci]"
          title: "chore(db): auto-export public database seed"
          body: "Automated nightly export of public database core content to `web/src/lib/supabase_seed.sql`."
          branch: "automated/db-seed-export"
          delete-branch: true
          base: master
